local_costmap:
  global_frame: odom_floor   # odom, shifted down to the floor (navigation.launch)
  update_frequency: 5.0
  publish_frequency: 2.0
  rolling_window: true
  width: 6.0
  height: 6.0
  resolution: 0.05
  plugins:
    - {name: obstacle_layer, type: "costmap_2d::VoxelLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  inflation_layer:
    # 0.7 / 3.0 like the global costmap: at 0.4 / 3.5 the cost gradient beyond the inscribed band was ~9 cm wide, so
    # DWA's obstacle term barely pushed back and it drove the centre to 0.10 m of a desk edge (lab2 home2, 2026-10-24)
    inflation_radius: 0.7
    cost_scaling_factor: 3.0
