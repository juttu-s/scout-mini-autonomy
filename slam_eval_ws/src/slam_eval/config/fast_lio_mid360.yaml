# FAST-LIO on the lab2 MID360 data. Upstream config/mid360.yaml, inputs from prepare_bag.py, nothing saved to disk.
common:
    lid_topic:  "/livox/custom"     # livox_ros_driver2/CustomMsg written by prepare_bag.py
    imu_topic:  "/livox/imu"        # in g: FAST-LIO rescales by the mean |acc| at start
    time_sync_en: false
    time_offset_lidar_to_imu: 0.0

preprocess:
    lidar_type: 1                   # Livox
    scan_line: 4
    blind: 0.5

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    360
    det_range:     100.0
    extrinsic_est_en:  false
    extrinsic_T: [ -0.011, -0.02329, 0.04412 ]   # MID360 lidar in its IMU frame (Livox spec)
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1]

publish:
    path_en:  false
    scan_publish_en:  true
    dense_publish_en: false
    scan_bodyframe_pub_en: false

pcd_save:
    pcd_save_en: false
    interval: -1
